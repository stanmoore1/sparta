id: org.sparta.sparta-gui
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: sparta-gui
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --share=network
build-options:
  build-args:
    - --share=network
rename-icon: sparta-gui
rename-desktop-file: sparta-gui.desktop
rename-appdata-file: sparta-gui.appdata.xml
rename-mime-file: sparta-input.xml
modules:
  # Build the SPARTA shared library from source and stage it in /app/lib, which
  # is on the flatpak LD_LIBRARY_PATH, so the plugin-mode GUI finds it there at
  # runtime (it searches for libsparta*.so*). SPARTA ships no install() rules,
  # so the library is copied out of the build tree explicitly.
  - name: sparta
    buildsystem: simple
    build-commands:
      - cmake -S cmake -B build-lib -G Ninja
          -D BUILD_SHARED_LIBS=ON -D BUILD_MPI=OFF -D CMAKE_BUILD_TYPE=Release
      - cmake --build build-lib -j ${FLATPAK_BUILDER_N_JOBS:-2}
      - install -d /app/lib
      - cp -a build-lib/src/libsparta*.so* /app/lib/
    sources:
      - type: git
        url: https://github.com/stanmoore1/sparta.git
        branch: claude/sparta-gui-docked-layout
  # Build SPARTA-GUI itself (plugin mode) from the tools/sparta-gui subdirectory.
  - name: sparta-gui
    buildsystem: cmake-ninja
    builddir: true
    subdir: tools/sparta-gui
    config-opts:
      - -D SPARTA_GUI_USE_PLUGIN=yes
      - -D BUILD_DOC=no
      - -D CMAKE_CXX_COMPILER=g++
      - -D CMAKE_C_COMPILER=gcc
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/stanmoore1/sparta.git
        branch: claude/sparta-gui-docked-layout
