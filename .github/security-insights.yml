# OpenSSF Security Insights file for the SPARTA project.
#
# This is a self-description of the project in a format that automated
# tools can read: who to contact, where the documentation is, which
# repositories belong to the project, and which checking tools are in use.
#
# Format specification: https://github.com/ossf/security-insights
# The file name and its location (repository root or .github folder) are
# fixed by that specification and must not be changed.
#
# Please update "last-updated" when changing this file and "last-reviewed"
# when reviewing its contents, e.g. when preparing a release.

header:
  schema-version: 2.2.0
  last-updated: '2026-10-06'
  last-reviewed: '2026-10-06'
  url: https://raw.githubusercontent.com/sparta/sparta/master/.github/security-insights.yml

project:
  name: SPARTA
  homepage: https://sparta.github.io
  administrators:
    - name: SPARTA developers
      primary: true
  documentation:
    detailed-guide: https://sparta.github.io/doc/Manual.html
    support-policy: https://github.com/sparta/sparta/blob/master/SECURITY.md
  repositories:
    - name: sparta
      url: https://github.com/sparta/sparta
      comment: |
        Main repository with the SPARTA source code, manual, tests, and examples.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: SPARTA developers
      primary: true
    policy: https://github.com/sparta/sparta/blob/master/SECURITY.md

repository:
  url: https://github.com/sparta/sparta
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: SPARTA developers
      primary: true
  documentation:
    security-policy: https://github.com/sparta/sparta/blob/master/SECURITY.md
    dependency-management-policy: https://github.com/sparta/sparta/blob/master/SECURITY.md#build-dependencies
  license:
    url: https://github.com/sparta/sparta/blob/master/LICENSE
    expression: GPL-2.0-only
  release:
    automated-pipeline: false
    distribution-points:
      - uri: https://github.com/sparta/sparta
        comment: Source code in the git repository
  security:
    assessments:
      self:
        evidence: https://github.com/sparta/sparta/blob/master/SECURITY.md
        comment: |
          No formal security review has been done.  SPARTA is a simulation
          program that is run by its users with their own permissions on
          their own input.  The resulting limitations are described in
          the security policy.
    tools:
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Reports known vulnerabilities in and updates for the GitHub
          Actions that are used by the project.
