# Build macOS disk images of SPARTA-GUI.
#
# There are three builds, split by when they run:
#
#   build-vtk-app        x86_64 (Intel) + the optional VTK 3D viewer.  This is
#                        the fast per-commit *test* build: it runs on every push
#                        to the development branches so regressions are caught
#                        early.  Homebrew's VTK is single-architecture, hence
#                        x86_64 only (it also runs on Apple Silicon under
#                        Rosetta 2).
#
#   build-dmg            universal (arm64 + x86_64), no VTK.  Release only.
#
#   build-vtk-universal  universal (arm64 + x86_64) + the VTK 3D viewer, with
#                        VTK compiled from source as a universal binary (there
#                        is no universal VTK in Homebrew).  Release only.
#
# The two universal images are what ships with a real SPARTA release, so they
# only build on a published GitHub Release or a manual "Run workflow"
# (workflow_dispatch) -- not on every commit.  Both are equivalent to the
# LAMMPS-macOS-multiarch-GUI dmg files the LAMMPS project publishes.

name: build-sparta-gui-macos

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - claude/sparta-gui-lammps-adaptation-jbih8k
      - claude/sparta-gui-docked-layout
    paths:
      - 'tools/sparta-gui/**'
      - 'src/**'
      - 'cmake/**'
      - '.github/workflows/sparta-gui-macos.yml'

concurrency:
  group: sparta-gui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Universal (arm64 + x86_64) image, no VTK.  Release only -- see header.
  # The official Qt binaries for macOS are universal, and both SPARTA and
  # SPARTA-GUI are built with CMAKE_OSX_ARCHITECTURES="arm64;x86_64", so a
  # single .app bundle runs natively on Apple Silicon and Intel Macs.  The
  # SPARTA shared library is linked into the bundle and deployed by macdeployqt
  # together with the Qt frameworks.
  # ---------------------------------------------------------------------------
  build-dmg:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official universal macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build SPARTA shared library (serial, universal)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI (plugin mode, universal)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          # copy the SPARTA icon, README, background image and examples into the
          # bundle tree so the app shows its icon and the dmg is styled
          cmake --build build-gui --target complete-bundle
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Create drag-n-drop installer disk image (dmg target)
        run: |
          export SPARTA_PLUGIN_LIB="$SPARTA_LIB"
          cmake --build build-gui --target dmg
          shasum -a 256 build-gui/SPARTA-GUI-macOS-multiarch-*.dmg | tee checksum.txt

      - name: Verify the bundled app launches
        run: |
          hdiutil attach build-gui/SPARTA-GUI-macOS-multiarch-*.dmg -mountpoint /Volumes/sgui-check
          /Volumes/sgui-check/SPARTA-GUI.app/Contents/MacOS/sparta-gui -v
          lipo -info /Volumes/sgui-check/SPARTA-GUI.app/Contents/Frameworks/libsparta.0.dylib
          hdiutil detach /Volumes/sgui-check

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-multiarch
          path: |
            build-gui/SPARTA-GUI-macOS-multiarch-*.dmg
            checksum.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Per-commit test build: x86_64 (Intel) with the optional VTK 3D viewer.
  # Homebrew's VTK is single-architecture, so this is x86_64-only.  GitHub
  # retired the Intel macos-13 runners, so we build it on the arm64 macos-14
  # runner by cross-compiling to x86_64 and getting an x86_64 VTK from a Rosetta
  # (x86_64) Homebrew.  VTK's Qt integration is not used (the viewer renders
  # off-screen).  Qt is bundled with macdeployqt and the VTK dylibs with
  # dylibbundler; the finished .app runs on Intel Macs (and on Apple Silicon
  # under Rosetta 2).  Runs on every push and manual dispatch, not on releases
  # (a release ships the universal VTK image below instead).
  # ---------------------------------------------------------------------------
  build-vtk-app:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official universal macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install Rosetta, an x86_64 Homebrew and x86_64 VTK
        run: |
          set -x
          # Rosetta 2 lets the arm64 runner run x86_64 tooling (the x86_64 brew,
          # and later the x86_64 app for the launch check).
          softwareupdate --install-rosetta --agree-to-license || true
          # A separate x86_64 Homebrew lives under /usr/local (the native arm64
          # brew is /opt/homebrew).  Install it if the runner doesn't have one.
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              "NONINTERACTIVE=1 $(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          # x86_64 VTK (and its deps) via the x86_64 brew.  One VTK dependency
          # (python@3.x) can fail to symlink over the runner's pre-installed
          # Python (idle3, 2to3, ...); that makes `brew install` exit non-zero
          # even though VTK itself is installed.  Tolerate it, then force-link
          # any python formula so nothing is left half-linked.  `env -u
          # GITHUB_ACTIONS` stops Homebrew from raising the harmless link
          # conflict as a GitHub error annotation on this (passing) job.
          env -u GITHUB_ACTIONS arch -x86_64 /usr/local/bin/brew install vtk || true
          for py in $(arch -x86_64 /usr/local/bin/brew list --formula 2>/dev/null | grep '^python@' || true); do
            env -u GITHUB_ACTIONS arch -x86_64 /usr/local/bin/brew link --overwrite --force "$py" || true
          done
          # dylibbundler via the native arm64 brew (it only rewrites Mach-O load
          # commands, so an arm64 tool handles the x86_64 binary fine).
          /opt/homebrew/bin/brew install dylibbundler
          VTK_PREFIX="$(arch -x86_64 /usr/local/bin/brew --prefix vtk)"
          test -d "$VTK_PREFIX/lib/cmake" || { echo "ERROR: x86_64 VTK not installed"; exit 1; }
          echo "VTK_PREFIX=$VTK_PREFIX" >> "$GITHUB_ENV"
          ls -d "$VTK_PREFIX"/lib/cmake/vtk-* || true
          lipo -info "$VTK_PREFIX"/lib/libvtkCommonCore*.dylib || true

      - name: Build SPARTA shared library (serial, x86_64)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI with the VTK viewer (x86_64)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D SPARTA_GUI_USE_VTK=ON \
            -D CMAKE_PREFIX_PATH="$VTK_PREFIX" \
            -D CMAKE_OSX_ARCHITECTURES="x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          # copy the SPARTA icon, README, background image and examples into the
          # bundle tree so the app shows its icon and the dmg is styled
          cmake --build build-gui --target complete-bundle
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Bundle VTK (dylibbundler) then Qt (macdeployqt)
        run: |
          set -x
          cd build-gui
          APP=sparta-gui.app
          FW="$PWD/$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # the plugin loader dlopens the SPARTA library from the bundle
          cp "$SPARTA_LIB" "$FW/libsparta.0.dylib"
          chmod 0755 "$FW/libsparta.0.dylib"

          # Bundling order matters.  dylibbundler runs FIRST and bundles ONLY the
          # x86_64 VTK dylibs into Contents/libs, ignoring the Qt SDK so the Qt
          # frameworks (still @rpath -> $QT_ROOT_DIR at this point) are left
          # untouched.  Running dylibbundler AFTER macdeployqt let it re-process
          # and corrupt the deployed QtNetwork.framework, so the app aborted at
          # launch with "Library not loaded: @rpath/QtNetwork.framework".
          dylibbundler -of -cd -b \
            -x "$APP/Contents/MacOS/sparta-gui" \
            -d "$APP/Contents/libs" \
            -p "@executable_path/../libs/" \
            -s "$VTK_PREFIX/lib" \
            -i "$QT_ROOT_DIR"

          # macdeployqt then deploys the Qt frameworks (incl. QtNetwork) and
          # plugins into Contents/Frameworks.
          macdeployqt "$APP" -verbose=1

          # Ensure the executable can actually find those frameworks.  macdeployqt
          # only adds the @executable_path/../Frameworks rpath when it rewrites an
          # *absolute* Qt path to @rpath; here Qt was already @rpath (and
          # dylibbundler left only the ../libs rpath for VTK), so that rpath is
          # missing and QtNetwork.framework (correctly deployed under Frameworks)
          # is not found at launch.  Add it explicitly if absent.
          EXE="$APP/Contents/MacOS/sparta-gui"
          if ! otool -l "$EXE" | grep -q "@executable_path/../Frameworks"; then
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE"
          fi

          echo "--- executable load commands ---"
          otool -L "$EXE" | sed -n '2,$p'
          echo "--- rpaths ---"
          otool -l "$EXE" | grep -A2 LC_RPATH || true
          echo "--- QtNetwork deployed? ---"
          ls "$APP/Contents/Frameworks/QtNetwork.framework/Versions/A/QtNetwork"

          # dylibbundler and install_name_tool rewrote Mach-O load commands, which
          # invalidates the ad-hoc code signatures the linker/macdeployqt applied.
          # macOS then reports the app as "damaged and can't be opened".  Re-sign
          # everything ad-hoc, inside-out (nested dylibs/frameworks first, then the
          # app), so the signatures are valid again.  The app is still not signed
          # with a Developer ID / notarized, so a *downloaded* copy needs one
          # Gatekeeper bypass (right-click > Open, or `xattr -dr
          # com.apple.quarantine SPARTA-GUI.app`) -- but it will no longer be
          # reported as damaged.
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            [ -d "$fw" ] && codesign --force --deep --timestamp=none --sign - "$fw" || true
          done
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP" || true

      - name: Verify the app launches under Rosetta (loads Qt + VTK from the bundle)
        run: |
          cd build-gui
          arch -x86_64 ./sparta-gui.app/Contents/MacOS/sparta-gui -v

      - name: Package as a styled drag-n-drop DMG
        run: |
          cd build-gui
          # The app is already fully bundled and ad-hoc signed above, so run the
          # shared packaging script in "pre-bundled" mode: it builds the styled
          # image (SPARTA icon, background, README, /Applications alias) directly
          # from the app without re-running macdeployqt or touching -- and thus
          # invalidating -- the signed bundle.
          DMG_PREBUNDLED=yes \
          DMG_OUTPUT=SPARTA-GUI-macOS-x86_64-vtk.dmg \
            "$GITHUB_WORKSPACE/tools/sparta-gui/packaging/build_macos_dmg.sh" 1.0.0
          shasum -a 256 SPARTA-GUI-macOS-x86_64-vtk.dmg | tee checksum-vtk.txt
          # sanity-check the app inside the dmg launches (signed) under Rosetta
          hdiutil attach SPARTA-GUI-macOS-x86_64-vtk.dmg -mountpoint /Volumes/sgui-vtk
          arch -x86_64 /Volumes/sgui-vtk/SPARTA-GUI.app/Contents/MacOS/sparta-gui -v
          hdiutil detach /Volumes/sgui-vtk || hdiutil detach /Volumes/sgui-vtk -force || true

      - name: Upload the VTK app
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-x86_64-vtk
          path: |
            build-gui/SPARTA-GUI-macOS-x86_64-vtk.dmg
            build-gui/checksum-vtk.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Universal (arm64 + x86_64) image WITH the VTK 3D viewer.  Release only.
  # There is no universal VTK in Homebrew, so VTK is compiled from source as a
  # universal binary (only the handful of modules the viewer needs, to keep the
  # build short) and cached between runs.  This is the image a real SPARTA
  # release ships for users who want the 3D viewer on both Apple Silicon and
  # Intel Macs natively.
  # ---------------------------------------------------------------------------
  build-vtk-universal:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    env:
      VTK_VERSION: '9.3.1'
      VTK_SERIES: '9.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official universal macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install dylibbundler
        run: /opt/homebrew/bin/brew install dylibbundler

      - name: Cache universal VTK
        id: cache-vtk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vtk-install
          key: vtk-universal-${{ env.VTK_VERSION }}-macos12-v1

      - name: Build universal VTK from source
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -fsSL -o vtk.tar.gz \
            "https://www.vtk.org/files/release/${VTK_SERIES}/VTK-${VTK_VERSION}.tar.gz"
          tar xf vtk.tar.gz
          # Enable only the modules the viewer links against (see the COMPONENTS
          # list in tools/sparta-gui/CMakeLists.txt); their dependencies
          # (CommonCore, CommonDataModel, RenderingCore, ...) are pulled in
          # automatically.  This keeps a universal build to ~15 min instead of
          # the ~45 min a full VTK would take.
          cmake -S "VTK-${VTK_VERSION}" -B vtk-build \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=ON \
            -D VTK_BUILD_TESTING=OFF \
            -D VTK_BUILD_EXAMPLES=OFF \
            -D VTK_WRAP_PYTHON=OFF \
            -D VTK_GROUP_ENABLE_Qt=NO \
            -D VTK_BUILD_ALL_MODULES=OFF \
            -D VTK_MODULE_ENABLE_VTK_CommonColor=YES \
            -D VTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -D VTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -D VTK_MODULE_ENABLE_VTK_FiltersSources=YES \
            -D VTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -D VTK_MODULE_ENABLE_VTK_IOXML=YES \
            -D VTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -D VTK_MODULE_ENABLE_VTK_RenderingOpenGL2=YES \
            -D VTK_MODULE_ENABLE_VTK_RenderingAnnotation=YES \
            -D VTK_MODULE_ENABLE_VTK_RenderingFreeType=YES \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -D CMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/vtk-install"
          cmake --build vtk-build -j3
          cmake --install vtk-build
          lipo -info "$GITHUB_WORKSPACE"/vtk-install/lib/libvtkCommonCore*.dylib

      - name: Locate VTK
        run: |
          VTK_PREFIX="$GITHUB_WORKSPACE/vtk-install"
          test -d "$VTK_PREFIX/lib/cmake" || { echo "ERROR: universal VTK missing"; exit 1; }
          echo "VTK_PREFIX=$VTK_PREFIX" >> "$GITHUB_ENV"
          ls -d "$VTK_PREFIX"/lib/cmake/vtk-* || true

      - name: Build SPARTA shared library (serial, universal)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI with the VTK viewer (universal)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D SPARTA_GUI_USE_VTK=ON \
            -D CMAKE_PREFIX_PATH="$VTK_PREFIX" \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          # copy the SPARTA icon, README, background image and examples into the
          # bundle tree so the app shows its icon and the dmg is styled
          cmake --build build-gui --target complete-bundle
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Bundle VTK (dylibbundler) then Qt (macdeployqt)
        run: |
          set -x
          cd build-gui
          APP=sparta-gui.app
          FW="$PWD/$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # the plugin loader dlopens the SPARTA library from the bundle
          cp "$SPARTA_LIB" "$FW/libsparta.0.dylib"
          chmod 0755 "$FW/libsparta.0.dylib"

          # dylibbundler FIRST (universal VTK dylibs into Contents/libs, ignoring
          # the Qt SDK), then macdeployqt for the Qt frameworks -- same ordering
          # and rpath handling as the x86_64 build above (see its comments).
          dylibbundler -of -cd -b \
            -x "$APP/Contents/MacOS/sparta-gui" \
            -d "$APP/Contents/libs" \
            -p "@executable_path/../libs/" \
            -s "$VTK_PREFIX/lib" \
            -i "$QT_ROOT_DIR"

          macdeployqt "$APP" -verbose=1

          EXE="$APP/Contents/MacOS/sparta-gui"
          if ! otool -l "$EXE" | grep -q "@executable_path/../Frameworks"; then
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE"
          fi

          echo "--- executable load commands ---"
          otool -L "$EXE" | sed -n '2,$p'
          lipo -info "$EXE"

          # re-sign ad-hoc, inside-out, after the Mach-O rewrites (see x86_64 job)
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --timestamp=none --sign - {} + 2>/dev/null || true
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            [ -d "$fw" ] && codesign --force --deep --timestamp=none --sign - "$fw" || true
          done
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP" || true

      - name: Verify the app launches (loads Qt + VTK from the bundle)
        run: |
          cd build-gui
          ./sparta-gui.app/Contents/MacOS/sparta-gui -v

      - name: Package as a styled drag-n-drop DMG
        run: |
          cd build-gui
          # pre-bundled/signed app -> build the styled image without touching it
          DMG_PREBUNDLED=yes \
          DMG_OUTPUT=SPARTA-GUI-macOS-multiarch-vtk.dmg \
            "$GITHUB_WORKSPACE/tools/sparta-gui/packaging/build_macos_dmg.sh" 1.0.0
          shasum -a 256 SPARTA-GUI-macOS-multiarch-vtk.dmg | tee checksum-multiarch-vtk.txt
          hdiutil attach SPARTA-GUI-macOS-multiarch-vtk.dmg -mountpoint /Volumes/sgui-uvtk
          /Volumes/sgui-uvtk/SPARTA-GUI.app/Contents/MacOS/sparta-gui -v
          lipo -info /Volumes/sgui-uvtk/SPARTA-GUI.app/Contents/Frameworks/libsparta.0.dylib
          hdiutil detach /Volumes/sgui-uvtk || hdiutil detach /Volumes/sgui-uvtk -force || true

      - name: Upload the universal VTK app
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-multiarch-vtk
          path: |
            build-gui/SPARTA-GUI-macOS-multiarch-vtk.dmg
            build-gui/checksum-multiarch-vtk.txt
          if-no-files-found: error
