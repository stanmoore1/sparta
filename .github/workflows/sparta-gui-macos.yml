# Build a universal (arm64 + x86_64) macOS disk image of SPARTA-GUI,
# equivalent to the LAMMPS-macOS-multiarch-GUI dmg files that the
# LAMMPS project publishes with its releases.
#
# The official Qt binaries for macOS are universal, and both SPARTA and
# SPARTA-GUI are built with CMAKE_OSX_ARCHITECTURES="arm64;x86_64", so a
# single .app bundle runs natively on Apple Silicon and Intel Macs.
# The SPARTA shared library is linked into the bundle and deployed by
# macdeployqt together with the Qt frameworks.

name: build-sparta-gui-macos

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sparta-gui-lammps-adaptation-jbih8k
    paths:
      - 'tools/sparta-gui/**'
      - 'src/**'
      - 'cmake/**'
      - '.github/workflows/sparta-gui-macos.yml'

concurrency:
  group: sparta-gui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official universal macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build SPARTA shared library (serial, universal)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI (plugin mode, universal)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Create drag-n-drop installer disk image (dmg target)
        run: |
          export SPARTA_PLUGIN_LIB="$SPARTA_LIB"
          cmake --build build-gui --target dmg
          shasum -a 256 build-gui/SPARTA-GUI-macOS-multiarch-*.dmg | tee checksum.txt

      - name: Verify the bundled app launches
        run: |
          hdiutil attach build-gui/SPARTA-GUI-macOS-multiarch-*.dmg -mountpoint /Volumes/sgui-check
          /Volumes/sgui-check/SPARTA-GUI.app/Contents/MacOS/sparta-gui -v
          lipo -info /Volumes/sgui-check/SPARTA-GUI.app/Contents/Frameworks/libsparta.0.dylib
          hdiutil detach /Volumes/sgui-check

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-multiarch
          path: |
            build-gui/SPARTA-GUI-macOS-multiarch-*.dmg
            checksum.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Second build: x86_64 (Intel) with the optional VTK 3D viewer enabled.
  # Homebrew's VTK is single-architecture, so this is a separate x86_64-only
  # build.  GitHub retired the Intel macos-13 runners, so we build it on the
  # arm64 macos-14 runner by cross-compiling to x86_64 and getting an x86_64 VTK
  # from a Rosetta (x86_64) Homebrew.  VTK's Qt integration is not used (the
  # viewer renders off-screen).  Qt is bundled with macdeployqt and the VTK
  # dylibs with dylibbundler; the finished .app is uploaded as a zip and runs on
  # Intel Macs (and on Apple Silicon under Rosetta 2).
  # ---------------------------------------------------------------------------
  build-vtk-app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official universal macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install Rosetta, an x86_64 Homebrew and x86_64 VTK
        run: |
          set -x
          # Rosetta 2 lets the arm64 runner run x86_64 tooling (the x86_64 brew,
          # and later the x86_64 app for the launch check).
          softwareupdate --install-rosetta --agree-to-license || true
          # A separate x86_64 Homebrew lives under /usr/local (the native arm64
          # brew is /opt/homebrew).  Install it if the runner doesn't have one.
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              "NONINTERACTIVE=1 $(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          # x86_64 VTK (and its deps) via the x86_64 brew.  One VTK dependency
          # (python@3.14) can fail to symlink over the runner's framework Python
          # (idle3 etc.); that makes `brew install` exit non-zero even though VTK
          # itself is installed, so tolerate it and verify VTK actually landed.
          arch -x86_64 /usr/local/bin/brew install vtk || true
          # dylibbundler via the native arm64 brew (it only rewrites Mach-O load
          # commands, so an arm64 tool handles the x86_64 binary fine).
          /opt/homebrew/bin/brew install dylibbundler
          VTK_PREFIX="$(arch -x86_64 /usr/local/bin/brew --prefix vtk)"
          test -d "$VTK_PREFIX/lib/cmake" || { echo "ERROR: x86_64 VTK not installed"; exit 1; }
          echo "VTK_PREFIX=$VTK_PREFIX" >> "$GITHUB_ENV"
          ls -d "$VTK_PREFIX"/lib/cmake/vtk-* || true
          lipo -info "$VTK_PREFIX"/lib/libvtkCommonCore*.dylib || true

      - name: Build SPARTA shared library (serial, x86_64)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI with the VTK viewer (x86_64)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D SPARTA_GUI_USE_VTK=ON \
            -D CMAKE_PREFIX_PATH="$VTK_PREFIX" \
            -D CMAKE_OSX_ARCHITECTURES="x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          cmake --build build-gui --target complete-bundle
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Bundle Qt, SPARTA library and VTK into the .app
        run: |
          cd build-gui
          APP=sparta-gui.app
          mkdir -p "$APP/Contents/Frameworks"
          cp "$SPARTA_LIB" "$APP/Contents/Frameworks/libsparta.0.dylib"
          chmod 0755 "$APP/Contents/Frameworks/libsparta.0.dylib"
          macdeployqt "$APP" -verbose=1
          # dylibbundler (native arm64 tool) rewrites the x86_64 binary's VTK
          # load commands and copies the x86_64 VTK dylibs into Contents/libs.
          dylibbundler -of -cd -b \
            -x "$APP/Contents/MacOS/sparta-gui" \
            -d "$APP/Contents/libs" \
            -p "@executable_path/../libs/"
          echo "--- remaining links (should be system-only) ---"
          otool -L "$APP/Contents/MacOS/sparta-gui" | sed -n '2,$p'

      - name: Verify the app launches under Rosetta (loads Qt + VTK from the bundle)
        run: |
          cd build-gui
          arch -x86_64 ./sparta-gui.app/Contents/MacOS/sparta-gui -v

      - name: Zip the .app
        run: |
          cd build-gui
          ditto -c -k --keepParent sparta-gui.app SPARTA-GUI-macOS-x86_64-vtk.zip
          shasum -a 256 SPARTA-GUI-macOS-x86_64-vtk.zip | tee checksum-vtk.txt

      - name: Upload the VTK app
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-x86_64-vtk
          path: |
            build-gui/SPARTA-GUI-macOS-x86_64-vtk.zip
            build-gui/checksum-vtk.txt
          if-no-files-found: error
