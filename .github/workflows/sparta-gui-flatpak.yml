# Build a Flatpak bundle of SPARTA-GUI, equivalent to the LAMMPS-GUI flatpak.
#
# Flatpak deliberately builds from the git repository named in the manifest
# (packaging/org.sparta.sparta-gui.yml), not from the local checkout: one
# module compiles the SPARTA shared library and stages it in /app/lib, a
# second module builds SPARTA-GUI itself in plugin mode. The GUI finds the
# library on the flatpak LD_LIBRARY_PATH at runtime.
#
# NOTE: the manifest clones from this repository, so the commit under test must
# be pushed before this workflow can succeed. The build step rewrites the
# manifest's git ref to this run's exact commit, so the artifact always matches
# the commit the run reports. The branch pinned in the manifest only matters for
# local builds.

name: build-sparta-gui-flatpak

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sparta-gui-docked-layout
      - claude/sparta-gui-v1.0-beta
    # Deliberately narrow: a flatpak build pulls the KDE runtime and compiles
    # everything from source, so it is far too slow to run on every commit.
    # It rebuilds when its own inputs change, and is run on demand (or for a
    # release) via workflow_dispatch to produce the shipping bundle.
    paths:
      - 'tools/sparta-gui/packaging/org.sparta.sparta-gui.yml'
      - '.github/workflows/sparta-gui-flatpak.yml'

concurrency:
  group: sparta-gui-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder ccache elfutils

      - name: Add the flathub remote (for the KDE runtime/SDK)
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the flatpak bundle
        run: |
          VERSION=1.0.0
          MANIFEST=tools/sparta-gui/packaging/org.sparta.sparta-gui.yml
          # The manifest clones from the remote rather than using this checkout,
          # and it names a branch. Two problems follow: on any branch other than
          # the pinned one it would quietly build somebody else's code, and a
          # branch name resolves at clone time, so a push landing mid-build
          # silently changes what ends up in the artifact. Pin to this run's
          # exact commit instead, which is both correct and reproducible.
          echo "building flatpak from commit: ${GITHUB_SHA}"
          sed -i "s|branch: claude/sparta-gui-[A-Za-z0-9._-]*|commit: ${GITHUB_SHA}|g" "${MANIFEST}"
          grep -nE 'commit:|branch:' "${MANIFEST}"
          flatpak-builder --force-clean --verbose \
            --repo=flatpak-repo --install-deps-from=flathub --user --ccache \
            --default-branch="${VERSION}" \
            flatpak-build "${MANIFEST}"
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo --verbose \
            flatpak-repo \
            "SPARTA-GUI-Linux-x86_64-${VERSION}.flatpak" \
            org.sparta.sparta-gui "${VERSION}"
          sha256sum SPARTA-GUI-Linux-x86_64-*.flatpak | tee checksum.txt

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-Linux-flatpak
          path: |
            SPARTA-GUI-Linux-x86_64-*.flatpak
            checksum.txt
          if-no-files-found: error
