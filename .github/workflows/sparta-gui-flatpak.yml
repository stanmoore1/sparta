# Build a Flatpak bundle of SPARTA-GUI, equivalent to the LAMMPS-GUI flatpak.
#
# Flatpak deliberately builds from the git repository named in the manifest
# (packaging/org.sparta.sparta-gui.yml), not from the local checkout: one
# module compiles the SPARTA shared library and stages it in /app/lib, a
# second module builds SPARTA-GUI itself in plugin mode. The GUI finds the
# library on the flatpak LD_LIBRARY_PATH at runtime.
#
# NOTE: the manifest points at this repository and branch, so the branch must
# be pushed before this workflow can succeed.

name: build-sparta-gui-flatpak

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sparta-gui-docked-layout
    paths:
      - 'tools/sparta-gui/packaging/org.sparta.sparta-gui.yml'
      - '.github/workflows/sparta-gui-flatpak.yml'

concurrency:
  group: sparta-gui-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder ccache elfutils

      - name: Add the flathub remote (for the KDE runtime/SDK)
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the flatpak bundle
        run: |
          VERSION=1.0.0
          MANIFEST=tools/sparta-gui/packaging/org.sparta.sparta-gui.yml
          flatpak-builder --force-clean --verbose \
            --repo=flatpak-repo --install-deps-from=flathub --user --ccache \
            --default-branch="${VERSION}" \
            flatpak-build "${MANIFEST}"
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo --verbose \
            flatpak-repo \
            "SPARTA-GUI-Linux-x86_64-${VERSION}.flatpak" \
            org.sparta.sparta-gui "${VERSION}"
          sha256sum SPARTA-GUI-Linux-x86_64-*.flatpak | tee checksum.txt

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-Linux-flatpak
          path: |
            SPARTA-GUI-Linux-x86_64-*.flatpak
            checksum.txt
          if-no-files-found: error
