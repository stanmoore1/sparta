# Build an arm64 (Apple Silicon) macOS app of SPARTA-GUI *with* the optional
# interactive VTK 3D viewer enabled (-D SPARTA_GUI_USE_VTK=ON).
#
# Unlike the universal build-sparta-gui-macos workflow, this one is arm64-only:
# Homebrew's VTK is single-architecture, so it cannot be linked into a universal
# (arm64+x86_64) binary.  The result therefore runs on Apple Silicon Macs only.
#
# VTK's Qt integration is *not* used (the viewer renders off-screen), so the
# Homebrew VTK -- whatever Qt it was built against -- is fine.  Qt frameworks are
# bundled with macdeployqt and the VTK dylibs with dylibbundler; the finished
# .app is uploaded as a zip (no .dmg) to keep the packaging simple.

name: build-sparta-gui-macos-vtk

on:
  workflow_dispatch:

concurrency:
  group: sparta-gui-macos-vtk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vtk-app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (official macOS binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install VTK and dylibbundler (Homebrew)
        run: |
          brew install vtk dylibbundler
          echo "VTK_PREFIX=$(brew --prefix vtk)" >> "$GITHUB_ENV"
          find "$(brew --prefix vtk)/lib/cmake" -maxdepth 1 -name 'vtk-*' -type d

      - name: Build SPARTA shared library (serial, arm64)
        run: |
          cmake -S cmake -B build-lib \
            -D BUILD_SHARED_LIBS=ON \
            -D BUILD_MPI=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="arm64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-lib -j3
          SPARTA_LIB=$(find "$PWD/build-lib" -name 'libsparta*.dylib' -type f | head -1)
          echo "SPARTA_LIB=$SPARTA_LIB" >> "$GITHUB_ENV"
          lipo -info "$SPARTA_LIB"

      - name: Build SPARTA-GUI with the VTK viewer (arm64)
        run: |
          cmake -S tools/sparta-gui -B build-gui \
            -D CMAKE_BUILD_TYPE=Release \
            -D SPARTA_GUI_USE_PLUGIN=ON \
            -D SPARTA_GUI_USE_VTK=ON \
            -D CMAKE_PREFIX_PATH="$VTK_PREFIX" \
            -D CMAKE_OSX_ARCHITECTURES="arm64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-gui -j3
          # copy examples / ParaView tools / readme into the bundle tree
          cmake --build build-gui --target complete-bundle
          lipo -info build-gui/sparta-gui.app/Contents/MacOS/sparta-gui

      - name: Bundle Qt, SPARTA library and VTK into the .app
        run: |
          cd build-gui
          APP=sparta-gui.app
          # SPARTA shared library (loaded as a plugin at runtime)
          mkdir -p "$APP/Contents/Frameworks"
          cp "$SPARTA_LIB" "$APP/Contents/Frameworks/libsparta.0.dylib"
          chmod 0755 "$APP/Contents/Frameworks/libsparta.0.dylib"
          # Qt frameworks + plugins
          macdeployqt "$APP" -verbose=1
          # VTK (and any other non-system dylibs the binary links) into Contents/libs,
          # rewriting the binary's load paths to @executable_path/../libs
          dylibbundler -of -cd -b \
            -x "$APP/Contents/MacOS/sparta-gui" \
            -d "$APP/Contents/libs" \
            -p "@executable_path/../libs/"
          echo "--- remaining non-bundled links (should be system-only) ---"
          otool -L "$APP/Contents/MacOS/sparta-gui" | sed -n '2,$p'

      - name: Verify the app launches (loads Qt + VTK from the bundle)
        run: |
          cd build-gui
          ./sparta-gui.app/Contents/MacOS/sparta-gui -v

      - name: Zip the .app
        run: |
          cd build-gui
          ditto -c -k --keepParent sparta-gui.app SPARTA-GUI-macOS-arm64-vtk.zip
          shasum -a 256 SPARTA-GUI-macOS-arm64-vtk.zip | tee checksum-vtk.txt

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA-GUI-macOS-arm64-vtk
          path: |
            build-gui/SPARTA-GUI-macOS-arm64-vtk.zip
            build-gui/checksum-vtk.txt
          if-no-files-found: error
