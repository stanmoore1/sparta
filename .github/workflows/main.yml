name: CI

on:
#  push:
#    branches: [ master ]
  pull_request:
    branches: [ master ]

# Define jobs: mpi, mpi-stubs-fft, mpi-stubs-kokkos-exact-fft, and bigbig
# Each jobs runs on ubuntu-22.04 and uses the cmake build system
# All jobs except for bigbig run ctest. The mpi-stubs-kokkos-exact-fft job runs
# the regression tests under KOKKOS ("-k on -sf kk") using the Serial backend
# and SPARTA_KOKKOS_EXACT so results match the non-KOKKOS gold-standard logs.
jobs:
  mpi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/mpi.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-Artifacts'
        path: 'build/examples/'
  mpi-stubs-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_UNIT_TESTING=ON \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
           ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    #- uses: actions/upload-artifact@v4
    #  if: '!cancelled()'
    #  with:
    #    name: 'mpi-stubs-fft-Artifacts'
    #    path: 'build/examples/'
  mpi-stubs-kokkos-exact-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      # Build the KOKKOS package with the Serial backend and SPARTA_KOKKOS_EXACT
      # so that KOKKOS reproduces the non-KOKKOS results exactly. This allows the
      # KOKKOS build to be regression tested against the existing (non-KOKKOS)
      # gold-standard log files. SPARTA_SPA_ARGS passes the KOKKOS command-line
      # args ("-k on -sf kk") to the sparta binary for every test.
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_KOKKOS_EXACT=ON \
          -DPKG_KOKKOS=ON \
          -DKokkos_ENABLE_SERIAL=ON \
          -DKokkos_ENABLE_OPENMP=OFF \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_SPA_ARGS='-k on -sf kk' \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-stubs-kokkos-exact-fft-Artifacts'
        path: 'build/examples/'
  # Build SPARTA as a shared library with the Python package and exercise the
  # Python wrapper / C library interface (python/test_library.py) via ctypes.
  python:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DPKG_PYTHON=ON \
          -DPKG_FFT=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        ctest --output-on-failure -R 'python.library'

  # Run the regression tests under the KOKKOS OpenMP backend with 2 threads.
  #
  # The Serial-backend KOKKOS job (SPARTA_KOKKOS_EXACT) reproduces the non-KOKKOS
  # results bit-for-bit, but it is single-threaded. This job exercises real
  # multithreading, which the serial job cannot -- catching data races and
  # non-deterministic reductions in the KOKKOS kernels. Under multiple threads
  # the RNG draw order changes, so the stochastic thermo columns no longer match
  # the serial gold logs bit-for-bit.
  #
  # Rather than loosen the tolerance for whole tests, comparison uses a sane
  # default relative tolerance (L1 norm, 25%) that covers most columns, plus a
  # small set of per-column overrides (regression.py -column_tolerance) applied
  # by column name across all tests. Each value has buffer above the observed
  # spread so runs do not intermittently fail:
  #   - 25% default: conserved/averaged columns (np, temperature, grid counts)
  #     and the various per-collision computes, which stay well within it
  #   - 50%: the semi-stochastic bulk collision counts (Nattempt, Ncoll)
  #   - 2.0 (guard only): the low-count integer surface/reaction columns and
  #     the surface-energy reduce (Nscoll, Nsreact, Nreact, Nscheck, c_echem)
  #     whose relative spread reaches ~100%
  # Only two decks are genuine outliers and carry an omp_options.<test> file:
  # a nearly collisionless surface deck whose Ncoll is uncorrelated
  # (surf_react_heatflux) and a per-cell collision-count reduce (mfp_mct).
  #
  # The same column tolerances also fit a KOKKOS GPU (CUDA) regression job,
  # which has a similar (slightly larger) statistical spread; a GPU job would
  # reuse these driver args with GPU KOKKOS flags (e.g. -k on g 1). The
  # '-custom omp_options' prefix is unique to the parallel-backend jobs, so the
  # bit-for-bit CPU and Serial-KOKKOS jobs (which pass neither -custom nor
  # -column_tolerance) are unaffected and keep their 1e-7 tolerance.
  #
  # 'package kokkos react/retry yes' (via -pk) makes reacting-flow collisions
  # retry allocation instead of aborting when the per-cell collision buffer
  # overflows, which otherwise fails intermittently under threading.
  #
  # surf.slide, adapt.slide, adapt.rotate and adapt.static are excluded outright
  # (ctest -E): fix move/surf and fix adapt + grid check have a thread-
  # scheduling-dependent "particle in interior cell" race that aborts the run,
  # which no tolerance can address. These are known limitations of threaded
  # KOKKOS, not regressions here.
  kokkos-omp-threaded:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/kokkos_omp.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_KOKKOS_EXACT=ON \
          -DKokkos_ENABLE_OPENMP=ON \
          -DKokkos_ENABLE_SERIAL=ON \
          -DPKG_FFT=ON \
          -DSPARTA_SPA_ARGS='-k on t 2 -sf kk -pk kokkos react/retry yes' \
          -DSPARTA_DSMC_TESTING_DRIVER_ARGS='-error_norm L1 -relative_error True -tolerance 0.25 -column_tolerance Natt:0.5,Ncoll:0.5,Nscoll:2.0,Nsreact:2.0,Nreact:2.0,Nscheck:2.0,c_echem:2.0 -custom omp_options' \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      env:
        OMP_NUM_THREADS: 2
        OMP_PROC_BIND: false
      run: |
        cd build
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4 \
          -E 'surf.slide|adapt.slide|adapt.rotate|adapt.static'

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'kokkos-omp-threaded-Artifacts'
        path: 'build/examples/'

  # Measure regression + unit test line/branch coverage with gcov/gcovr and
  # publish the report as a build artifact to establish a coverage baseline.
  coverage:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt install openmpi-bin libopenmpi-dev
        python3 -m pip install --user gcovr

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/mpi.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_UNIT_TESTING=ON \
          -DSPARTA_ENABLE_COVERAGE=ON \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4 || true

    - name: Coverage report
      run: |
        cd build
        mkdir -p coverage
        gcovr --root ../src --object-directory . \
          --print-summary \
          --xml coverage/coverage.xml \
          --html-details coverage/coverage.html \
          --gcov-ignore-parse-errors 2>/dev/null || \
        gcovr --root ../src --object-directory . --print-summary

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'coverage-report'
        path: 'build/coverage/'

  bigbig:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/kokkos_omp.cmake \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_DEFAULT_CXX_COMPILE_FLAGS='-DSPARTA_BIGBIG' \
          ../cmake

    - name: Build
      run: cd build; make -j4
