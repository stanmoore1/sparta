name: CI

on:
#  push:
#    branches: [ master ]
  pull_request:
    branches: [ master ]

# Define jobs: mpi, mpi-stubs-fft, mpi-stubs-kokkos-exact-fft, and bigbig
# Each jobs runs on ubuntu-22.04 and uses the cmake build system
# All jobs except for bigbig run ctest. The mpi-stubs-kokkos-exact-fft job runs
# the regression tests under KOKKOS ("-k on -sf kk") using the Serial backend
# and SPARTA_KOKKOS_EXACT so results match the non-KOKKOS gold-standard logs.
jobs:
  mpi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/mpi.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-Artifacts'
        path: 'build/examples/'
  mpi-stubs-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_UNIT_TESTING=ON \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
           ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    #- uses: actions/upload-artifact@v4
    #  if: '!cancelled()'
    #  with:
    #    name: 'mpi-stubs-fft-Artifacts'
    #    path: 'build/examples/'
  mpi-stubs-kokkos-exact-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      # Build the KOKKOS package with the Serial backend and SPARTA_KOKKOS_EXACT
      # so that KOKKOS reproduces the non-KOKKOS results exactly. This allows the
      # KOKKOS build to be regression tested against the existing (non-KOKKOS)
      # gold-standard log files. SPARTA_SPA_ARGS passes the KOKKOS command-line
      # args ("-k on -sf kk") to the sparta binary for every test.
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_KOKKOS_EXACT=ON \
          -DPKG_KOKKOS=ON \
          -DKokkos_ENABLE_SERIAL=ON \
          -DKokkos_ENABLE_OPENMP=OFF \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_SPA_ARGS='-k on -sf kk' \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-stubs-kokkos-exact-fft-Artifacts'
        path: 'build/examples/'
  # Build SPARTA as a shared library with the Python package and exercise the
  # Python wrapper / C library interface (python/test_library.py) via ctypes.
  python:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DPKG_PYTHON=ON \
          -DPKG_FFT=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        ctest --output-on-failure -R 'python.library'

  # Exercise the KOKKOS OpenMP backend with real multithreading (2 threads).
  #
  # The Serial-backend KOKKOS job (SPARTA_KOKKOS_EXACT) already checks that
  # KOKKOS reproduces the non-KOKKOS results numerically, but it is
  # single-threaded. Under multiple threads the RNG draw order changes, so the
  # stochastic thermo output no longer matches the serial gold logs to a tight
  # tolerance -- a numeric comparison would be too loose to be meaningful or
  # would be flaky. Instead this job runs each deck under the threaded binary
  # and checks it completes cleanly (no crash, error, NaN, or deadlock), which
  # is what multithreading actually stresses.
  #
  # The deck list is a curated set of threading-stable kernels (free-molecular,
  # collisions, static surfaces, grid flow). Reacting-collision and moving-
  # surface decks are excluded: they trip pre-existing, thread-scheduling-
  # dependent robustness issues in the KOKKOS kernels (collision-buffer overflow
  # needing collide_modify react/retry; a moving-surface grid-check race), which
  # would make the job flaky. Those are known limitations of threaded KOKKOS,
  # not regressions in this suite.
  kokkos-omp-threaded:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/kokkos_omp.cmake \
          -DKokkos_ENABLE_OPENMP=ON \
          -DKokkos_ENABLE_SERIAL=ON \
          -DPKG_FFT=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Threaded smoke test
      run: |
        python3 tools/testing/kokkos_threaded_smoke.py \
          --sparta build/src/spa_kokkos_omp --threads 2 \
          --skip stats,react,qk,tceqk,tally,piston,vanish,distributed \
          examples/free examples/circle examples/step \
          examples/sphere examples/collide

  # Measure regression + unit test line/branch coverage with gcov/gcovr and
  # publish the report as a build artifact to establish a coverage baseline.
  coverage:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt install openmpi-bin libopenmpi-dev
        python3 -m pip install --user gcovr

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/mpi.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_UNIT_TESTING=ON \
          -DSPARTA_ENABLE_COVERAGE=ON \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4 || true

    - name: Coverage report
      run: |
        cd build
        mkdir -p coverage
        gcovr --root ../src --object-directory . \
          --print-summary \
          --xml coverage/coverage.xml \
          --html-details coverage/coverage.html \
          --gcov-ignore-parse-errors 2>/dev/null || \
        gcovr --root ../src --object-directory . --print-summary

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'coverage-report'
        path: 'build/coverage/'

  bigbig:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/kokkos_omp.cmake \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_DEFAULT_CXX_COMPILE_FLAGS='-DSPARTA_BIGBIG' \
          ../cmake

    - name: Build
      run: cd build; make -j4
